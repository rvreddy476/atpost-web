name: Build & push zone images

# Builds each Multi-Zone app into a container and pushes to ECR (atpost/web-<zone>).
# GitHub-OIDC → CI role (same one used for CodeArtifact). ArgoCD (in modernsmapp)
# then deploys the pushed tag per deploy/web/<zone>/values-<env>.yaml.
#
# Required: secret AWS_CI_ROLE_ARN, var AWS_ACCOUNT_ID (region ap-south-1).
# Optimization TODO: build only --affected zones (turbo) instead of the matrix.

on:
  push:
    branches: [main]
    paths: ["apps/**", "packages/**", "Dockerfile", ".github/workflows/build-push.yml"]
  workflow_dispatch:
    inputs:
      zone:
        description: "Single zone to build (blank = all)"
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # STALE (not deleted here, flagged 2026-09-16): dating, community, creator,
        # messenger, live and memories have no app under apps/, so those jobs fail
        # at `turbo run build --filter`; reels and tube exist but are not listed.
        zone: [shell, commerce, admin, dating, social, community, creator, messenger, live, memories, miniapps, kwit]
    steps:
      - uses: actions/checkout@v4

      - name: Skip non-selected zones (manual single-zone runs)
        id: gate
        run: |
          sel="${{ github.event.inputs.zone }}"
          if [ -n "$sel" ] && [ "$sel" != "${{ matrix.zone }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.run == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ap-south-1

      - if: steps.gate.outputs.run == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - if: steps.gate.outputs.run == 'true'
        name: Build & push web-${{ matrix.zone }}
        env:
          IMAGE: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com/atpost/web-${{ matrix.zone }}
          # The admin console is served at the root of its own host
          # (e.g. admin.cleestudio.com) with its own strict CSP and HSTS.
          # Set these repository variables before the first own-host deploy.
          ADMIN_SIGN_IN_URL: ${{ vars.ADMIN_SIGN_IN_URL }}
          ADMIN_API_ORIGIN: ${{ vars.ADMIN_API_ORIGIN }}
        run: |
          extra=""
          if [ "${{ matrix.zone }}" = "admin" ]; then
            extra="--build-arg ADMIN_BASE_PATH=/ --build-arg NEXT_PUBLIC_ADMIN_SIGN_IN_URL=$ADMIN_SIGN_IN_URL --build-arg NEXT_PUBLIC_ADMIN_API_ORIGIN=$ADMIN_API_ORIGIN"
          fi
          docker build --build-arg ZONE=${{ matrix.zone }} $extra \
            -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
